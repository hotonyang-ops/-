<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>미드나잇 오라클 - 오늘의 운세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #0a0a15;
    --bg-deep: #050508;
    --panel: #13131f;
    --panel-line: rgba(201,204,214,0.16);
    --gold: #d4af7a;
    --gold-bright: #f2d29a;
    --silver: #c7cbd6;
    --silver-bright: #eef0f6;
    --text: #e8e6f1;
    --text-muted: #8b8aa2;
    --glow-gold: rgba(212,175,122,0.28);
    --glow-silver: rgba(199,203,214,0.22);
    --font-en: 'Cinzel', 'Times New Roman', serif;
    --font-kr: 'Gowun Batang', 'Nanum Myeongjo', serif;
  }

  * { box-sizing: border-box; }

  html, body{
    margin: 0;
    min-height: 100%;
  }

  body{
    background: radial-gradient(ellipse 120% 90% at 50% -10%, #171728 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: var(--font-kr);
  }

  .starfield{
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .star{
    position: absolute;
    border-radius: 50%;
    background: var(--silver-bright);
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%, 100% { opacity: .15; }
    50% { opacity: 1; }
  }

  .page{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    max-width: 560px;
    margin: 0 auto;
    padding: 56px 20px 72px;
    text-align: center;
  }

  .eyebrow{
    font-family: var(--font-en);
    font-size: 11px;
    letter-spacing: .32em;
    color: var(--gold);
    text-transform: uppercase;
    opacity: .85;
  }

  .title{
    font-family: var(--font-kr);
    font-weight: 700;
    font-size: clamp(30px, 7vw, 42px);
    letter-spacing: .06em;
    margin: 0;
    text-wrap: balance;
    background: linear-gradient(180deg, var(--silver-bright), var(--silver) 60%, var(--gold) 130%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 30px var(--glow-silver);
  }

  .subtitle{
    margin: 0;
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.7;
    max-width: 40ch;
  }

  .stage{
    position: relative;
    width: 240px;
    height: 340px;
  }

  .deck-shadow-1, .deck-shadow-2{
    position: absolute;
    inset: 0;
    border-radius: 18px;
    border: 1px solid var(--panel-line);
    background: linear-gradient(160deg, var(--panel), var(--bg-deep));
  }
  .deck-shadow-1{ transform: rotate(-6deg) translateY(6px); }
  .deck-shadow-2{ transform: rotate(5deg) translateY(4px); }

  .card-scene{
    position: absolute;
    inset: 0;
    perspective: 1400px;
  }

  .card{
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.6,.05,.2,1);
  }
  .card.shuffling{
    animation: shuffle .6s ease-in-out;
  }
  @keyframes shuffle{
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-6px) rotate(-3deg); }
    40% { transform: translateX(5px) rotate(2.5deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(3px) rotate(1.5deg); }
  }

  .card-face{
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .card-face.front{
    background: linear-gradient(160deg, #16162a, #0c0c17);
    border: 1px solid rgba(212,175,122,0.35);
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(199,203,214,0.06) inset, 0 20px 50px rgba(0,0,0,0.55);
  }
  .front-sigil{ color: var(--gold); width: 128px; height: 128px; opacity: .9; }
  .front-frame{
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(199,203,214,0.22);
    border-radius: 12px;
  }

  .card-face.back{
    transform: rotateY(180deg);
    background: linear-gradient(165deg, #17172b, #0b0b14);
    border: 1px solid rgba(199,203,214,0.28);
    padding: 22px 18px 20px;
    align-items: center;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
  }

  .card-icon-wrap{
    width: 76px;
    height: 76px;
    color: var(--gold-bright);
    filter: drop-shadow(0 0 10px var(--glow-gold));
    margin-bottom: 10px;
    opacity: 0;
    transform: translateY(6px);
  }
  .card-name{
    font-family: var(--font-en);
    font-size: 19px;
    letter-spacing: .18em;
    color: var(--silver-bright);
    margin: 0 0 2px;
    opacity: 0;
    transform: translateY(6px);
  }
  .card-sub{
    font-size: 12.5px;
    color: var(--gold);
    letter-spacing: .04em;
    margin: 0 0 14px;
    opacity: 0;
    transform: translateY(6px);
  }
  .card-divider{
    width: 36px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--panel-line), transparent);
    margin: 0 0 14px;
    opacity: 0;
  }
  .card-overall{
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    margin: 0 0 16px;
    opacity: 0;
    transform: translateY(6px);
  }
  .card-details{
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
    opacity: 0;
    transform: translateY(6px);
  }
  .card-detail{
    display: flex;
    gap: 8px;
    font-size: 12px;
    line-height: 1.55;
    text-align: left;
    color: var(--text-muted);
  }
  .card-detail b{
    flex: 0 0 auto;
    color: var(--silver);
    font-family: var(--font-en);
    font-size: 10px;
    letter-spacing: .08em;
    padding-top: 2px;
  }

  .card.revealed .card-icon-wrap,
  .card.revealed .card-name,
  .card.revealed .card-sub,
  .card.revealed .card-divider,
  .card.revealed .card-overall,
  .card.revealed .card-details{
    opacity: 1;
    transform: translateY(0);
    transition: opacity .6s ease, transform .6s ease;
  }
  .card.revealed .card-name{ transition-delay: .05s; }
  .card.revealed .card-sub{ transition-delay: .12s; }
  .card.revealed .card-divider{ transition-delay: .18s; }
  .card.revealed .card-overall{ transition-delay: .24s; }
  .card.revealed .card-details{ transition-delay: .32s; }

  .draw-btn{
    font-family: var(--font-kr);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: .02em;
    color: var(--bg-deep);
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    border: none;
    border-radius: 999px;
    padding: 14px 34px;
    cursor: pointer;
    box-shadow: 0 8px 24px var(--glow-gold);
    transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .draw-btn:hover{ transform: translateY(-1px); box-shadow: 0 10px 28px var(--glow-gold); }
  .draw-btn:active{ transform: translateY(0); }
  .draw-btn:disabled{ opacity: .55; cursor: default; transform: none; }
  .draw-btn:focus-visible{ outline: 2px solid var(--silver-bright); outline-offset: 3px; }

  .hint{
    font-size: 12px;
    color: var(--text-muted);
    min-height: 16px;
  }

  @media (prefers-reduced-motion: reduce){
    .card, .draw-btn, .star{ transition: none !important; animation: none !important; }
  }

  @media (max-width: 380px){
    .stage{ width: 210px; height: 300px; }
  }
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<div class="page">
  <p class="eyebrow">THE MIDNIGHT DECK</p>
  <h1 class="title">미드나잇 오라클</h1>
  <p class="subtitle">여덟 장의 카드 속에 오늘의 기운이 숨어 있습니다.<br>카드를 뽑아 오늘의 운세를 확인해보세요.</p>

    <div class="card-scene">

              <line x1="18.7" y1="18.7" x2="26.7" y2="26.7"/>
              <line x1="73.3" y1="73.3" x2="81.3" y2="81.3"/>
              <line x1="81.3" y1="18.7" x2="73.3" y2="26.7"/>
              <line x1="18.7" y1="81.3" x2="26.7" y2="73.3"/>
            </g>
          </svg>
        </div>
        <div class="card-face back" id="cardBack"></div>
      </div>
    </div>
  </div>

  <button class="draw-btn" id="drawBtn" type="button">카드 뽑기</button>
  <p class="hint" id="hint"></p>
</div>

      '</div>';
  }

  btn.addEventListener('click', function(){
    if (busy) return;
    busy = true;
    btn.disabled = true;
    card.classList.remove('revealed');
    hint.textContent = '카드를 섞는 중...';
    card.classList.add('shuffling');

    setTimeout(function(){
      card.classList.remove('shuffling');
      var pick = CARDS[Math.floor(Math.random() * CARDS.length)];
      renderCard(pick);
      rotation += 180;
      card.style.transform = 'rotateY(' + rotation + 'deg)';

      setTimeout(function(){
        card.classList.add('revealed');
        btn.disabled = false;
        btn.textContent = '다시 뽑기';
        hint.textContent = '';
        busy = false;
      }, 1000);
    }, 600);
  });
})();
</script>
</body>
</html>
